name: Petrarch
description: >-
  Petrarch is a Y Combinator (Summer 2026) data-marketplace company based in San
  Francisco that unlocks enterprise data for the AI economy. Petrarch sources
  proprietary, enterprise-facing datasets from distressed businesses and legacy
  industries such as construction, manufacturing, and logistics, clears and
  anonymizes them, and brokers them to AI companies and research labs building
  for the physical world. Notable data types transacted include construction
  plans, autonomous-driving recordings, and codebases. The company was founded
  by Harvard graduates Ian Lee, Samuel Hahn, and Sudhish Swain, with prior
  experience at organizations including Scale AI. As of this profile Petrarch
  operates a public marketing website but does not publish a public developer
  API, SDKs, or developer documentation.
